[package]
name = "ptw"
description = "Push to Whisper: hold a key, talk, and the words appear where you are typing"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ptw"
path = "src/main.rs"

[dependencies]
ptw-core = { path = "../ptw-core" }
ptw-engine-transcribe = { path = "../ptw-engine-transcribe" }
sha2 = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
xkeysym = "0.2"
evdev = "0.13"
cpal = "0.18"
ksni = "0.3"
zbus = { version = "5", features = ["tokio"] }
hound = "3"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
xkbcommon = "0.9"
