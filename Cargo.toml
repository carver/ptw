[workspace]
resolver = "3"
members = ["crates/ptw-core", "crates/ptw-engine-transcribe", "crates/ptw"]
# Benchmark harnesses build on their own (see bench/README.md).
exclude = ["bench/sherpa-bench", "bench/tcpp-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/carver/ptw"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
tracing = "0.1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 4

# Light optimisation for the workspace crates keeps tests quick while still
# debuggable. Dependencies get more, and no debug info, which keeps target/
# small on the shared mount (the sandbox disk is small too). This also
# builds transcribe.cpp as Release rather than Debug in tests.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
