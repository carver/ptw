[workspace]
resolver = "3"
members = ["crates/ptw-core", "crates/ptw"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/carver/ptw"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
tracing = "0.1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 4
